{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Скидання пароля</h2>
    <p>Введіть вашу електронну адресу, і ми надішлемо вам інструкції для скидання пароля.</p>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Надіслати лист</button>
    </form>
</div>
{% endblock %}
