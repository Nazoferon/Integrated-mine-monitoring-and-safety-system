{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Введіть новий пароль</h2>
    
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Змінити пароль</button>
        </form>
    {% else %}
        <p>Посилання для скидання пароля недійсне. Можливо, воно вже було використане.</p>
        <p>Будь ласка, запросіть нове скидання пароля.</p>
    {% endif %}
</div>
{% endblock %}
