{% extends 'diploma/base_auth.html' %}
{% load static %}

{% block title %}Пароль змінено{% endblock %}

{% block content %}
<div class="login-container">
    <div class="auth-form">
        <div class="form-header">
            <i class="fas fa-shield-alt fa-3x" style="color: var(--success-color); margin-bottom: 20px;"></i>
            <h2>Пароль успішно змінено!</h2>
            <p class="text-muted">Тепер ви можете увійти в систему з вашим новим паролем.</p>
        </div>
        
        <div class="form-footer" style="margin-top: 30px;">
            <a href="{% url 'login' %}" class="btn btn-primary">Перейти до сторінки входу</a>
        </div>
    </div>
</div>
{% endblock %}
