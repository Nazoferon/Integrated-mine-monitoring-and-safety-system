{% extends 'diploma/base.html' %}
{% load static %}

{% block title %}Карта Шахти - Глибина 4.0{% endblock %}

{% block extra_css %}
<style>
    /* На весь екран без відступів */
    .dashboard-main .container-fluid {
        padding: 0 !important;
        height: calc(100vh - 70px);
        overflow: hidden;
    }

    .mine-map-wrapper {
        display: flex;
        width: 100%;
        height: 100%;
        background: #0f0f0f; /* Темний фон */
        position: relative;
        overflow: hidden;
    }

    /* --- ЛІВА ПАНЕЛЬ --- */
    .map-objects-panel {
        position: absolute;
        left: 20px; top: 20px; bottom: 20px;
        width: 280px;
        background: rgba(30, 30, 30, 0.95);
        backdrop-filter: blur(8px);
        border: 1px solid #444;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        color: #ddd;
        z-index: 10;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        transition: transform 0.3s ease;
    }
    
    .map-objects-panel.collapsed { transform: translateX(-320px); }

    /* Кнопка згортання */
    .panel-toggle {
        position: absolute; right: -30px; top: 50%;
        width: 30px; height: 60px;
        background: #333;
        border-radius: 0 8px 8px 0;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; border: 1px solid #444; border-left: none; color: #aaa;
    }
    .panel-toggle:hover { color: #fff; background: #444; }

    .panel-header {
        padding: 15px; border-bottom: 1px solid #444;
        background: rgba(255, 255, 255, 0.05); border-radius: 12px 12px 0 0;
    }
    .panel-header h4 { margin: 0; font-size: 16px; color: #4dabf7; font-weight: 600; }
    .panel-stats { font-size: 11px; color: #888; margin-top: 5px; }

    /* Список */
    .objects-list { flex: 1; overflow-y: auto; padding: 10px; }
    .objects-list::-webkit-scrollbar { width: 4px; }
    .objects-list::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

    .obj-group-title {
        font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
        color: #666; margin: 15px 0 5px 5px; font-weight: bold;
    }

    /* Стилі елементів списку */
    .list-tunnel-item {
        margin-bottom: 4px; border-radius: 6px; overflow: hidden;
        border: 1px solid transparent; transition: 0.2s;
    }
    .tunnel-header {
        padding: 8px 12px; background: rgba(255,255,255,0.03); cursor: pointer;
        display: flex; justify-content: space-between; align-items: center;
        font-size: 13px; color: #ccc;
    }
    .tunnel-header:hover { background: rgba(255,255,255,0.08); color: white; }
    
    /* Активний (вибраний) */
    .list-tunnel-item.selected .tunnel-header {
        background: rgba(77, 171, 247, 0.15); border-left: 3px solid #4dabf7;
        padding-left: 9px; color: #4dabf7;
    }

    /* Вкладені */
    .tunnel-devices-list {
        display: none; background: rgba(0,0,0,0.2); padding: 2px 0; border-top: 1px solid #444;
    }
    .list-tunnel-item.expanded .tunnel-devices-list { display: block; }
    .list-tunnel-item.expanded .fa-chevron-right { transform: rotate(90deg); }

    .list-device-item {
        padding: 6px 12px 6px 30px; font-size: 12px; color: #999;
        cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    }
    .list-device-item:hover { color: white; background: rgba(255,255,255,0.05); }
    .list-device-item.selected {
        color: #4dabf7; font-weight: bold; background: rgba(77, 171, 247, 0.1);
    }

    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #00ff00; box-shadow: 0 0 5px #00ff00; }

    /* --- КАРТА --- */
    .map-canvas-area { flex: 1; position: relative; overflow: hidden; cursor: grab; background: radial-gradient(circle at center, #141414 0%, #0a0a0a 100%); }
    .map-canvas-area:active { cursor: grabbing; }
    canvas { display: block; width: 100%; height: 100%; }

    /* Кнопки */
    .map-controls-floating {
        position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 10;
    }
    .map-btn {
        background: rgba(0,0,0,0.6); border: 1px solid #555; color: white;
        width: 40px; height: 40px; border-radius: 8px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        backdrop-filter: blur(5px); transition: 0.2s;
    }
    .map-btn:hover { background: #4dabf7; border-color: #4dabf7; transform: scale(1.05); }

    /* --- POPUP (ІНФО ПРИ КЛІКУ) --- */
    #map-popup {
        position: absolute;
        background: rgba(15, 15, 15, 0.95);
        border: 1px solid #4dabf7;
        color: white;
        padding: 12px;
        border-radius: 8px;
        display: none;
        z-index: 200;
        font-size: 13px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        min-width: 160px;
        pointer-events: none; /* Щоб клікати крізь нього */
        transform: translate(-50%, -120%); /* Центруємо над об'єктом */
    }
    /* Стрілочка */
    #map-popup::after {
        content: ''; position: absolute; bottom: -6px; left: 50%; margin-left: -6px;
        border-width: 6px 6px 0; border-style: solid;
        border-color: #4dabf7 transparent transparent transparent;
    }
    .popup-title { color: #4dabf7; font-weight: bold; font-size: 14px; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }
    .popup-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .popup-label { color: #888; }

</style>
{% endblock %}

{% block content %}
<div class="mine-map-wrapper">
    
    <div class="map-objects-panel" id="sidebar-panel">
        <div class="panel-toggle" onclick="toggleSidebar()">
            <i class="fas fa-chevron-left" id="toggle-icon"></i>
        </div>
        <div class="panel-header">
            <h4><i class="fas fa-sitemap"></i> Об'єкти Шахти</h4>
            <div class="panel-stats">
                <span id="stat-tunnels">0</span> штреків, <span id="stat-devices">0</span> AP
            </div>
        </div>
        <div class="objects-list" id="objects-tree-container">
            </div>
    </div>

    <div class="map-canvas-area" id="map-area">
        <div class="map-controls-floating">
            <button class="map-btn" onclick="resetView()" title="Центрувати"><i class="fas fa-compress-arrows-alt"></i></button>
            <a href="{% url 'download_map' %}" class="map-btn" title="Скачати JSON"><i class="fas fa-file-download"></i></a>
        </div>
        
        <canvas id="map-canvas"></canvas>
        
        <div id="map-popup"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 1. ДАНІ
    const rawData = '{{ map_data | escapejs }}'; 
    const mapData = rawData ? JSON.parse(rawData) : {tunnels:[], yards:[], devices:[]};

    // 2. ЗМІННІ
    const canvas = document.getElementById('map-canvas');
    const ctx = canvas.getContext('2d');
    const popup = document.getElementById('map-popup');
    const mapArea = document.getElementById('map-area');

    let scale = 1.0;
    let offsetX = 0, offsetY = 0;
    let isDragging = false, startX, startY;
    
    let hoveredObject = null;   // Під курсором
    let selectedObject = null;  // Вибраний (клік)

    function initMap() {
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // --- EVENTS ---
        canvas.addEventListener('mousedown', e => {
            if (hoveredObject) {
                // Клік по об'єкту -> Вибір
                selectObject(hoveredObject.type, hoveredObject.data);
                isDragging = false;
            } else {
                // Клік в пустоту -> Драг карти
                selectObject(null, null);
                isDragging = true;
                startX = e.clientX - offsetX;
                startY = e.clientY - offsetY;
                canvas.style.cursor = 'grabbing';
            }
            draw();
        });

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            if (isDragging) {
                offsetX = e.clientX - startX;
                offsetY = e.clientY - startY;
                // Якщо тягнемо карту, попап теж має рухатись (якщо є вибраний об'єкт)
                updatePopupPosition(); 
                draw();
            } else {
                checkHover(mx, my);
                draw();
            }
        });

        canvas.addEventListener('mouseup', () => { isDragging = false; canvas.style.cursor = 'grab'; });
        
        // ЗУМ до курсора
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const zoomSpeed = 0.1;
            const delta = e.deltaY < 0 ? 1 : -1;
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            
            zoomAtPoint(mx, my, delta * zoomSpeed);
        }, { passive: false });

        buildHierarchyTree(); // Будуємо список зліва
        
        // Автоцентрування
        if (mapData.tunnels && mapData.tunnels.length > 0) {
            const t = mapData.tunnels[0];
            focusOn((t.x1+t.x2)/2*10, (t.y1+t.y2)/2*10);
        } else {
            resetView();
        }
    }

    function resizeCanvas() {
        canvas.width = mapArea.clientWidth;
        canvas.height = mapArea.clientHeight;
        draw();
    }

    function zoomAtPoint(x, y, amount) {
        const wx = (x - offsetX) / scale;
        const wy = (y - offsetY) / scale;
        let newScale = scale * (1 + amount);
        newScale = Math.max(0.1, Math.min(10.0, newScale));
        offsetX = x - wx * newScale;
        offsetY = y - wy * newScale;
        scale = newScale;
        updatePopupPosition();
        draw();
    }

    // --- МАЛЮВАННЯ ---
    function draw() {
        ctx.fillStyle = '#0f0f0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawGrid();

        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        // 1. РУДДВОРИ (Фон)
        if (mapData.yards) {
            mapData.yards.forEach(y => {
                const x = y.x * 10, yPos = y.y * 10, w = y.w * 10, h = y.h * 10;
                ctx.fillStyle = '#222';
                ctx.fillRect(x - w/2, yPos - h/2, w, h);
                ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
                ctx.strokeRect(x - w/2, yPos - h/2, w, h);
                
                if (scale > 0.3) {
                    ctx.fillStyle = '#666'; ctx.font = '14px Arial'; ctx.textAlign = 'center';
                    ctx.fillText(y.name || "Руддвір", x, yPos);
                }
            });
        }

        // 2. ТУНЕЛІ
        if (mapData.tunnels) {
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            mapData.tunnels.forEach(t => {
                const isHovered = (hoveredObject && hoveredObject.data === t);
                const isSelected = (selectedObject && selectedObject.data === t);
                const x1 = t.x1*10, y1 = t.y1*10, x2 = t.x2*10, y2 = t.y2*10;

                // Підсвітка
                if (isSelected || isHovered) {
                    ctx.lineWidth = 16;
                    ctx.strokeStyle = isSelected ? '#4dabf7' : '#333'; // Синій якщо вибраний
                    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
                } else {
                    ctx.lineWidth = 12; ctx.strokeStyle = '#222'; 
                    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
                }

                // Внутрішня частина
                ctx.lineWidth = 6; ctx.strokeStyle = '#5a4d41'; ctx.stroke();

                // Назва штреку
                if (scale > 0.4 || isSelected) {
                    ctx.fillStyle = isSelected ? '#4dabf7' : '#888';
                    ctx.font = '10px Arial'; ctx.textAlign = 'center';
                    ctx.fillText(t.name, (x1+x2)/2, (y1+y2)/2 - 10);
                }

                // Вкладені девайси
                if (t.devices) t.devices.forEach(d => drawDevice(d.x*10, d.y*10, d));
            });
        }
        
        // 3. ОКРЕМІ ДЕВАЙСИ (якщо є)
        if (mapData.devices) mapData.devices.forEach(d => drawDevice(d.x*10, d.y*10, d));

        ctx.restore();
    }

    function drawDevice(x, y, d) {
        const isHovered = (hoveredObject && hoveredObject.data === d);
        const isSelected = (selectedObject && selectedObject.data === d);

        // Кільце виділення
        if (isSelected || isHovered) {
            ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI*2);
            ctx.fillStyle = isSelected ? 'rgba(77, 171, 247, 0.4)' : 'rgba(255,255,255,0.2)';
            ctx.fill();
            if (isSelected) { ctx.strokeStyle = '#4dabf7'; ctx.lineWidth = 2; ctx.stroke(); }
        }

        // --- ВИПРАВЛЕНО: ЯСКРАВИЙ КОЛІР ---
        ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI*2);
        ctx.fillStyle = '#00ffff'; // Яскравий Cyan (був чорний)
        ctx.fill();
        ctx.strokeStyle = 'black'; ctx.lineWidth = 1; ctx.stroke();

        // Текст ID
        if (scale > 0.6 || isSelected) {
            ctx.fillStyle = isSelected ? '#4dabf7' : '#fff';
            ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
            ctx.fillText(d.id, x, y - 12);
        }
    }

    function drawGrid() {
        const step = 50 * scale;
        if (step < 10) return;
        ctx.beginPath(); ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1;
        const sx = (offsetX % step) - step, sy = (offsetY % step) - step;
        for (let x=sx; x<canvas.width; x+=step) { ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); }
        for (let y=sy; y<canvas.height; y+=step) { ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); }
        ctx.stroke();
    }

    // --- ЛОГІКА ХОВЕРА ---
    function checkHover(mx, my) {
        const wx = (mx - offsetX) / scale;
        const wy = (my - offsetY) / scale;
        hoveredObject = null;
        canvas.style.cursor = 'grab';

        // 1. Девайси (пріоритет)
        const checkDevs = (list) => {
            list.forEach(d => {
                const dist = Math.hypot(d.x*10 - wx, d.y*10 - wy);
                if (dist < 15/scale + 5) {
                    hoveredObject = { type: 'device', data: d };
                    canvas.style.cursor = 'pointer';
                }
            });
        };
        if (mapData.tunnels) mapData.tunnels.forEach(t => { if(t.devices) checkDevs(t.devices); });
        if (mapData.devices) checkDevs(mapData.devices);

        if (hoveredObject) return;

        // 2. Штреки
        if (mapData.tunnels) {
            mapData.tunnels.forEach(t => {
                const dist = distToSegment(wx, wy, t.x1*10, t.y1*10, t.x2*10, t.y2*10);
                if (dist < 10) { // Радіус чутливості штреку
                    hoveredObject = { type: 'tunnel', data: t };
                    canvas.style.cursor = 'pointer';
                }
            });
        }
    }

    function distToSegment(px, py, x1, y1, x2, y2) {
        const l2 = (x1-x2)**2 + (y1-y2)**2;
        if (l2 == 0) return Math.hypot(px-x1, py-y1);
        let t = ((px-x1)*(x2-x1) + (py-y1)*(y2-y1)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (x1 + t*(x2-x1)), py - (y1 + t*(y2-y1)));
    }

    // --- ЛОГІКА ВИБОРУ (POPUP) ---
    function selectObject(type, data) {
        selectedObject = (type && data) ? { type, data } : null;
        
        // Оновити список зліва
        document.querySelectorAll('.list-tunnel-item, .list-device-item').forEach(el => el.classList.remove('selected'));

        if (selectedObject) {
            // Підсвітка в списку
            if (type === 'tunnel') {
                const idx = mapData.tunnels.indexOf(data);
                if (idx >= 0) document.getElementById(`tree-tunnel-${idx}`).classList.add('selected');
            } else if (type === 'device') {
                mapData.tunnels.forEach((t, tIdx) => {
                    if (t.devices) {
                        const dIdx = t.devices.indexOf(data);
                        if (dIdx >= 0) {
                            document.getElementById(`tree-tunnel-${tIdx}`).classList.add('expanded'); // Розгорнути
                            document.getElementById(`tree-dev-${tIdx}-${dIdx}`).classList.add('selected');
                        }
                    }
                });
            }
            // Показати спливаюче вікно
            showPopup();
        } else {
            popup.style.display = 'none';
        }
        draw();
    }

    function showPopup() {
        if (!selectedObject) return;
        
        let html = '';
        if (selectedObject.type === 'device') {
            const d = selectedObject.data;
            html = `<div class="popup-title"><i class="fas fa-wifi"></i> ${d.id}</div>
                    <div class="popup-row"><span class="popup-label">Тип:</span> WiFi Repeater</div>
                    <div class="popup-row"><span class="popup-label">Статус:</span> <span style="color:#00ff00">Online</span></div>
                    <div class="popup-row"><span class="popup-label">Коорд:</span> ${d.x}, ${d.y}</div>`;
        } else if (selectedObject.type === 'tunnel') {
            const t = selectedObject.data;
            const len = Math.hypot(t.x2-t.x1, t.y2-t.y1).toFixed(1);
            html = `<div class="popup-title"><i class="fas fa-road"></i> ${t.name}</div>
                    <div class="popup-row"><span class="popup-label">Довжина:</span> ${len} м</div>
                    <div class="popup-row"><span class="popup-label">Пристроїв:</span> ${t.devices ? t.devices.length : 0}</div>`;
        }
        popup.innerHTML = html;
        popup.style.display = 'block';
        updatePopupPosition();
    }

    function updatePopupPosition() {
        if (!selectedObject) return;
        
        let wx, wy;
        if (selectedObject.type === 'device') {
            wx = selectedObject.data.x * 10;
            wy = selectedObject.data.y * 10;
        } else { // Tunnel center
            const t = selectedObject.data;
            wx = (t.x1 + t.x2) / 2 * 10;
            wy = (t.y1 + t.y2) / 2 * 10;
        }

        const sx = wx * scale + offsetX;
        const sy = wy * scale + offsetY;

        popup.style.left = sx + 'px';
        popup.style.top = sy + 'px';
    }

    // --- UI ДЕРЕВО ---
    function buildHierarchyTree() {
        const container = document.getElementById('objects-tree-container');
        container.innerHTML = '';
        
        let tCount = 0, dCount = 0;

        // Руддвори
        if (mapData.yards && mapData.yards.length > 0) {
            container.innerHTML += `<div class="obj-group-title">Інфраструктура</div>`;
            mapData.yards.forEach(y => {
                container.innerHTML += `<div style="padding:8px 12px; color:#aaa; font-size:13px;">${y.name || 'Руддвір'}</div>`;
            });
        }

        // Штреки
        if (mapData.tunnels) {
            container.innerHTML += `<div class="obj-group-title">Штреки та Мережа</div>`;
            mapData.tunnels.forEach((t, idx) => {
                tCount++;
                const hasDevs = t.devices && t.devices.length > 0;
                
                let html = `
                    <div class="list-tunnel-item" id="tree-tunnel-${idx}">
                        <div class="tunnel-header" onclick="handleListClick('tunnel', ${idx})">
                            <span><i class="fas fa-road" style="color:#666;"></i> ${t.name}</span>
                            ${hasDevs ? `<i class="fas fa-chevron-right" style="font-size:10px; color:#555;"></i>` : ''}
                        </div>
                `;

                if (hasDevs) {
                    html += `<div class="tunnel-devices-list">`;
                    t.devices.forEach((d, dIdx) => {
                        dCount++;
                        html += `
                            <div class="list-device-item" id="tree-dev-${idx}-${dIdx}" onclick="handleListClick('device', ${idx}, ${dIdx}); event.stopPropagation();">
                                <span><i class="fas fa-wifi" style="color:#00ffff;"></i> ${d.id}</span>
                                <span class="status-dot"></span>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
                container.innerHTML += html;
            });
        }
        document.getElementById('stat-tunnels').innerText = tCount;
        document.getElementById('stat-devices').innerText = dCount;
    }

    window.handleListClick = function(type, tIdx, dIdx) {
        if (type === 'tunnel') {
            const t = mapData.tunnels[tIdx];
            document.getElementById(`tree-tunnel-${tIdx}`).classList.toggle('expanded');
            selectObject('tunnel', t);
            focusOn((t.x1+t.x2)/2*10, (t.y1+t.y2)/2*10);
        } else if (type === 'device') {
            const d = mapData.tunnels[tIdx].devices[dIdx];
            selectObject('device', d);
            focusOn(d.x*10, d.y*10);
        }
    };

    window.toggleSidebar = function() {
        const p = document.getElementById('sidebar-panel');
        const i = document.getElementById('toggle-icon');
        p.classList.toggle('collapsed');
        i.className = p.classList.contains('collapsed') ? 'fas fa-chevron-right' : 'fas fa-chevron-left';
    }

    window.focusOn = function(x, y) {
        offsetX = canvas.width/2 - x * scale;
        offsetY = canvas.height/2 - y * scale;
        updatePopupPosition();
        draw();
    };

    window.resetView = function() {
        scale = 1.0; offsetX = canvas.width/2; offsetY = canvas.height/2; 
        updatePopupPosition(); draw();
    };

    initMap();
</script>
{% endblock %}
