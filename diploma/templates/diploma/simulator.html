{% extends 'diploma/base.html' %}
{% load static %}

{% block title %}Симулятор ESP32 | MineCAD{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'diploma/css/pages/simulator.css' %}?v=2">
{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <h2 class="mb-4"><i class="fas fa-gamepad text-primary"></i> Пульт Симулятора Телеметрії</h2>
    
    <div class="simulator-panel">
        <form id="simulatorForm" data-api-url="{% url 'api_telemetry' %}">
            <div class="row">
                <!-- Пристрій та Мережа -->
                <div class="col-md-6 mb-4">
                    <div class="sim-section h-100">
                        <h4 class="sim-section-title"><i class="fas fa-microchip"></i> Пристрій та Мережа</h4>
                        
                        <div class="mb-3">
                            <label class="form-label text-light">Джерело сигналу (Хто надсилає)</label>
                            <select id="simMacAddress" class="form-select sim-input" required>
                                <option value="" disabled selected>-- Оберіть пристрій --</option>
                                <optgroup label="Мобільні пристрої (Персонал)">
                                    {% for emp in employees %}
                                        <option value="{{ emp.device.mac_address }}">
                                            {{ emp.last_name }} {{ emp.first_name|first }}. ({{ emp.device.inventory_number }})
                                        </option>
                                    {% endfor %}
                                </optgroup>
                                <optgroup label="Стаціонарні датчики">
                                    {% for sensor in static_sensors %}
                                        <option value="{{ sensor.mac_address }}">
                                            Датчик {{ sensor.inventory_number }}
                                        </option>
                                    {% endfor %}
                                </optgroup>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-light">Точка доступу (Wi-Fi BSSID / Репітер)</label>
                            <select id="simApUid" class="form-select sim-input" required>
                                <option value="" disabled selected>-- Оберіть репітер --</option>
                                {% for ap in aps %}
                                    <option value="{{ ap.wifi_bssid|default:ap.uid }}">{{ ap.uid }} {% if ap.wifi_bssid %}({{ ap.wifi_bssid }}){% endif %}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">Версія прошивки</label>
                            <input type="text" id="simFwVersion" class="form-control sim-input" value="1.0.0">
                        </div>
                        
                        <div class="mb-3 mt-4">
                            <div class="form-check form-switch fs-5">
                                <input class="form-check-input" type="checkbox" id="simIsMoving" checked>
                                <label class="form-check-label text-light ms-2" for="simIsMoving">Пристрій знаходиться в русі (Is Moving)</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Сенсори -->
                <div class="col-md-6 mb-4">
                    <div class="sim-section h-100">
                        <h4 class="sim-section-title"><i class="fas fa-satellite-dish"></i> Сенсори (Мікроклімат та Заряд)</h4>
                        
                        <div class="mb-3">
                            <label class="form-label text-light d-flex justify-content-between">
                                <span><i class="fas fa-battery-half text-success"></i> Батарея (%)</span>
                                <span id="valBattery" class="sim-value-display">100%</span>
                            </label>
                            <input type="range" class="form-range" id="simBattery" min="0" max="100" value="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light d-flex justify-content-between">
                                <span><i id="simGasIcon" class="fas fa-cloud text-success"></i> Метан (CH4 % LEL)</span>
                                <span id="valGas" class="sim-value-display text-success border-success">0 % LEL</span>
                            </label>
                            <input type="range" class="form-range" id="simGas" min="0" max="100" value="0" step="0.1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light d-flex justify-content-between">
                                <span><i class="fas fa-thermometer-half text-danger"></i> Температура (°C)</span>
                                <span id="valTemp" class="sim-value-display">22.5 °C</span>
                            </label>
                            <input type="range" class="form-range" id="simTemp" min="-10" max="60" step="0.5" value="22.5">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light d-flex justify-content-between">
                                <span><i class="fas fa-wifi text-info"></i> RSSI (Рівень Wi-Fi)</span>
                                <span id="valRssi" class="sim-value-display">-60 dBm</span>
                            </label>
                            <input type="range" class="form-range" id="simRssi" min="-100" max="-30" value="-60">
                        </div>
                    </div>
                </div>
            </div>

            <div class="sim-actions">
                <button type="button" id="btnSendNormal" class="sim-btn btn-send"><i class="fas fa-paper-plane"></i> Надіслати телеметрію</button>
                <button type="button" id="btnSendSos" class="sim-btn btn-sos"><i class="fas fa-exclamation-triangle"></i> Тривога (Кнопка SOS)</button>
                <button type="button" id="btnCancelSos" class="sim-btn btn-cancel-sos"><i class="fas fa-check-circle"></i> Скасувати тривогу</button>
                <button type="button" id="btnAutoPing" class="sim-btn btn-auto-ping"><i class="fas fa-robot"></i> Авто-симуляція (5с)</button>
            </div>
            <div id="simStatus" class="sim-status-text text-center mt-3"></div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'diploma/js/simulator.js' %}?v=2"></script>
{% endblock %}
