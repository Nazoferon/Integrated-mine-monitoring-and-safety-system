{% load static %}
{% load widget_tweaks %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=4.0">
    <title>{% block title %}Глибина 4.0 - Авторизація{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'diploma/image/favicon.ico' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'diploma/css/login_style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="login-body">
    <!-- Анімований фон -->
    <div class="login-background">
        <div class="bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
        </div>
    </div>

    <!-- Основний контент -->
    {% block content %}{% endblock %}

    <!-- Футер -->
    <footer class="login-page-footer">
        <div class="container">
            <p>&copy; 2026 Глибина 4.0. Система моніторингу шахти. Усі права захищено.</p>
        </div>
    </footer>

    <script src="{% static 'diploma/js/diploma_login.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
