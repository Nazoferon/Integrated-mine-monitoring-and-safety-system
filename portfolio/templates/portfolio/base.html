{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BunB - Portfolio{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'portfolio/image/favicon.ico' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'portfolio/css/landing.css' %}">  
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="/" class="logo">
                    <svg class="bunny-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 50 Q10 30 30 20 Q50 10 70 20 Q90 30 80 50 Q90 70 70 80 Q50 90 30 80 Q10 70 20 50 M30 30 Q35 25 40 30 M60 30 Q65 25 70 30 M45 50 Q50 55 55 50" stroke="#8a63d2" stroke-width="4" fill="none" stroke-linecap="round"/>
                    </svg>
                    BunB
                </a>
                <button class="menu-toggle" aria-label="Відкрити меню">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-links">
                    <li><a href="/#projects">Проєкти</a></li>
                    <li><a href="/#contact">Контакти</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
      <div class="container">
        <div class="footer-content" style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <p>2026. BunB. Усі права захищено</p>
            <a href="{% url 'privacy_policy' %}" class="privacy-link">Політика конфіденційності</a>
        </div>
      </div>
    </footer>

    <script src="{% static 'portfolio/js/script.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
